# =============================================================================
# angelina007.com — Full Stack: Caddy + Main Site + Wiki + PostgreSQL
# =============================================================================
# Usage:
#   docker compose up -d                  # Start all services
#   docker compose up -d next-app         # Start only main site
#   docker compose up -d wiki-app         # Start only wiki
#   docker compose restart wiki-app       # Restart wiki independently
#   docker compose logs -f caddy          # Watch proxy logs
#   docker compose down                   # Stop everything
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Reverse Proxy — Caddy (automatic HTTPS, no certbot needed)
  # ---------------------------------------------------------------------------
  caddy:
    image: caddy:2-alpine
    container_name: angelina-caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3 (QUIC)
      - "8080:8080"     # Local dev: main site
      - "8081:8081"     # Local dev: wiki
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data        # TLS certificates
      - caddy_config:/config    # Caddy config state
    # 2026-07-12 修复：依赖条件从 service_healthy 放宽为 service_started。
    # 教训：wiki 的健康检查误报曾导致 Caddy 拒绝启动，主站被拖下线。
    # 反向代理不应被后端健康状态阻塞——后端不健康顶多 502，主站其他部分照常服务。
    depends_on:
      next-app:
        condition: service_started
      wiki-app:
        condition: service_started
    networks:
      - angelina-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # Main Site — Next.js application (angelina007.com)
  # ---------------------------------------------------------------------------
  next-app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: angelina-next-app
    restart: always
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_SITE_URL: https://angelina007.com
      NEXT_PUBLIC_ANALYTICS_ID: ${NEXT_PUBLIC_ANALYTICS_ID:-}
      NEXT_PUBLIC_SANITY_PROJECT_ID: ${NEXT_PUBLIC_SANITY_PROJECT_ID:-}
      NEXT_PUBLIC_SANITY_DATASET: ${NEXT_PUBLIC_SANITY_DATASET:-production}
      SANITY_API_TOKEN: ${SANITY_API_TOKEN:-}
    expose:
      - "3000"
    # 2026-07-12 修复：健康检查改为消费完响应体后按状态码退出。
    # 旧写法从不读取响应，进程会挂到 keep-alive 超时，容易被误判不健康。
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000', (r) => { r.resume(); r.on('end', () => process.exit(r.statusCode === 200 ? 0 : 1)); }).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - angelina-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # Wiki — Custom Node.js wiki app (wiki.angelina007.com)
  # ---------------------------------------------------------------------------
  wiki-app:
    build:
      context: ./wiki
      dockerfile: Dockerfile
    container_name: angelina-wiki
    restart: always
    environment:
      NODE_ENV: production
      PORT: "4000"
    expose:
      - "4000"
    volumes:
      # Mount content separately so you can update articles without rebuilding
      - ./wiki/content:/app/content:ro
    # 2026-07-12 修复：同上，消费响应体；超时 5s→10s（/api/articles 响应较大，
    # 旧检查的挂起时长恰好压在 5s 边界上，导致稳定误报 unhealthy）。
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4000/api/articles', (r) => { r.resume(); r.on('end', () => process.exit(r.statusCode === 200 ? 0 : 1)); }).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - angelina-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # Database — PostgreSQL (for future use: analytics, comments, etc.)
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: angelina-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-angelina}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_in_production}
      POSTGRES_DB: ${POSTGRES_DB:-angelina_wiki}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-angelina}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - angelina-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# =============================================================================
# Volumes
# =============================================================================
volumes:
  caddy_data:
    driver: local
  caddy_config:
    driver: local
  postgres_data:
    driver: local

# =============================================================================
# Networks
# =============================================================================
networks:
  angelina-network:
    driver: bridge
