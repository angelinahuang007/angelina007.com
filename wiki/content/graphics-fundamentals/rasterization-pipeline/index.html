<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPU Rasterization Pipeline</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/lib/wiki-interactive.css" />
    <script src="/lib/wiki-interactive.js"></script>
    <style>
        :root {
            --wiki-dark-bg: #1a1b27;
            --wiki-accent: #6366f1;
            --wiki-text: #e4e4e7;
        }

        body {
            padding: 20px;
            font-family: 'Space Grotesk', sans-serif;
            max-width: 900px;
            margin: 0 auto;
        }
        .pipeline-container {
            display: flex;
            gap: 30px;
            margin: 30px 0;
            flex-wrap: wrap;
        }
        .pipeline-diagram { flex: 1; min-width: 300px; }
        .pipeline-viz { flex: 1; min-width: 300px; }

        canvas {
            border: 1px solid var(--border-color);
            border-radius: 8px;
            display: block;
            margin: 20px 0;
            background: var(--bg-secondary);
            max-width: 100%;
            height: auto;
        }

        .stage-button {
            padding: 12px 16px;
            margin: 5px;
            border: none;
            border-radius: 6px;
            background: var(--wiki-accent);
            color: var(--wiki-text);
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s;
            font-family: 'Space Grotesk', sans-serif;
        }
        .stage-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
            background: var(--wiki-accent);
        }
        .stage-button.active {
            background: var(--wiki-dark-bg);
            color: var(--wiki-accent);
            border: 2px solid var(--wiki-accent);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
        }

        .stages-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin: 20px 0;
        }

        .formula-box {
            background: var(--bg-secondary);
            padding: 15px;
            border-radius: 6px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            margin: 15px 0;
            border-left: 4px solid var(--wiki-accent);
            color: var(--wiki-text);
        }

        .info-panel {
            background: var(--bg-secondary);
            padding: 15px;
            border-radius: 6px;
            margin: 15px 0;
        }
        .info-panel h3 {
            margin-top: 0;
            color: var(--wiki-accent);
        }
        .info-panel p {
            color: var(--wiki-text);
        }
    </style>
</head>
<body>
    <h1>GPU Rasterization Pipeline</h1>
    <p>The GPU processes 3D geometry through a series of transformations and tests. Click each stage to see what happens.</p>

    <div class="pipeline-container">
        <div class="pipeline-diagram">
            <h3>Pipeline Stages</h3>
            <div class="stages-grid" id="stagesContainer"></div>

            <div class="info-panel" id="infoPanel">
                <h3 id="stageName">Select a stage</h3>
                <p id="stageDesc"></p>
                <div class="formula-box" id="formulaBox" style="display:none;"></div>
            </div>
        </div>

        <div class="pipeline-viz">
            <canvas id="canvas" width="500" height="500"></canvas>
        </div>
    </div>

    <script>
        const stages = [
            {
                name: 'Vertex Shader',
                desc: 'Transform vertices from object space to clip space. Apply model-view-projection matrix.',
                formula: 'v_clip = MVP × v_object',
                animate: animateVertexShader
            },
            {
                name: 'Tessellation',
                desc: 'Optionally subdivide patches into smaller triangles for detail and LOD.',
                formula: 'patches → subdivided triangles',
                animate: animateTessellation
            },
            {
                name: 'Geometry Shader',
                desc: 'Emit new vertices to create more complex shapes from primitives.',
                formula: 'primitives → expanded geometry',
                animate: animateGeometryShader
            },
            {
                name: 'Rasterization',
                desc: 'Scan-convert triangles into fragments (potential pixels).',
                formula: 'coverage(x,y) = point-in-triangle test',
                animate: animateRasterization
            },
            {
                name: 'Fragment Shader',
                desc: 'Determine final color for each fragment. Apply lighting, texturing, etc.',
                formula: 'color = texture + lighting + effects',
                animate: animateFragmentShader
            },
            {
                name: 'Framebuffer',
                desc: 'Depth test, alpha blend, and write final color to backbuffer.',
                formula: 'if (depth < z_buffer) write(color)',
                animate: animateFramebuffer
            }
        ];

        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let currentStage = 0;
        let animationTime = 0;
        let isAnimating = true;

        function setupStages() {
            const container = document.getElementById('stagesContainer');
            stages.forEach((stage, i) => {
                const btn = document.createElement('button');
                btn.className = 'stage-button' + (i === 0 ? ' active' : '');
                btn.textContent = stage.name;
                btn.onclick = () => selectStage(i);
                container.appendChild(btn);
            });
        }

        function selectStage(index) {
            currentStage = index;
            animationTime = 0;
            isAnimating = true;
            updateUI();
            animate();
        }

        function updateUI() {
            const stage = stages[currentStage];
            document.querySelectorAll('.stage-button').forEach((btn, i) => {
                btn.classList.toggle('active', i === currentStage);
            });
            document.getElementById('stageName').textContent = stage.name;
            document.getElementById('stageDesc').textContent = stage.desc;
            const formulaBox = document.getElementById('formulaBox');
            if (stage.formula) {
                formulaBox.textContent = stage.formula;
                formulaBox.style.display = 'block';
            }
        }

        function drawBackground() {
            const colors = Wiki.colors();
            ctx.fillStyle = colors.bg_secondary;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.strokeStyle = colors.border_color;
            ctx.lineWidth = 0.5;
            const gridSize = 30;
            for (let x = 0; x < canvas.width; x += gridSize) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
                ctx.stroke();
            }
            for (let y = 0; y < canvas.height; y += gridSize) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();
            }
        }

        function animateVertexShader(t) {
            drawBackground();
            const colors = Wiki.colors();
            const progress = (Math.sin(t * 1.0) + 1) / 2;

            // Original vertices
            const vertices = [[100, 150], [150, 200], [120, 250]];

            ctx.fillStyle = colors.accent + '40';
            ctx.strokeStyle = colors.accent;
            ctx.lineWidth = 2;

            // Draw transformation
            ctx.font = 'bold 14px JetBrains Mono';
            ctx.fillStyle = colors.text;
            ctx.fillText('Object Space', 50, 40);
            ctx.fillText('→ Clip Space', 300, 40);

            // Left triangle (object)
            ctx.beginPath();
            ctx.moveTo(vertices[0][0], vertices[0][1]);
            ctx.lineTo(vertices[1][0], vertices[1][1]);
            ctx.lineTo(vertices[2][0], vertices[2][1]);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // Right triangle (transformed with rotation)
            ctx.save();
            ctx.translate(350, 200);
            ctx.rotate(progress * Math.PI);
            ctx.scale(0.8 + progress * 0.2, 0.8 + progress * 0.2);
            ctx.fillStyle = colors.primary + '40';
            ctx.strokeStyle = colors.primary;
            ctx.beginPath();
            ctx.moveTo(-50, -50);
            ctx.lineTo(0, 50);
            ctx.lineTo(-50, 50);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            ctx.restore();

            // Draw vertices
            vertices.forEach(v => {
                ctx.fillStyle = colors.accent;
                ctx.beginPath();
                ctx.arc(v[0], v[1], 4, 0, Math.PI * 2);
                ctx.fill();
            });
        }

        function animateTessellation(t) {
            drawBackground();
            const colors = Wiki.colors();
            const progress = (Math.sin(t * 0.7) + 1) / 2;
            const level = Math.floor(progress * 3) + 1;

            ctx.font = 'bold 14px JetBrains Mono';
            ctx.fillStyle = colors.text;
            ctx.fillText('Patch → ' + (2 ** (level + 1)) + ' triangles', 50, 40);

            function drawPatch(x, y, size, divisions) {
                for (let i = 0; i <= divisions; i++) {
                    const t = i / divisions;
                    ctx.strokeStyle = colors.accent + (40 + i * (150 / divisions)).toString(16);
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.moveTo(x, y + i * (size / divisions));
                    ctx.lineTo(x + size, y + i * (size / divisions));
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(x + i * (size / divisions), y);
                    ctx.lineTo(x + i * (size / divisions), y + size);
                    ctx.stroke();
                }
            }

            drawPatch(100, 150, 200, level);

            ctx.fillStyle = colors.primary;
            ctx.font = '12px JetBrains Mono';
            ctx.fillText('Tessellation Level: ' + level, 100, 380);
        }

        function animateGeometryShader(t) {
            drawBackground();
            const colors = Wiki.colors();
            const progress = (Math.sin(t * 0.9) + 1) / 2;

            ctx.font = 'bold 14px JetBrains Mono';
            ctx.fillStyle = colors.text;
            ctx.fillText('Input Primitive → Expanded Geometry', 50, 40);

            // Input triangle
            ctx.fillStyle = colors.accent + '40';
            ctx.strokeStyle = colors.accent;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(150, 150);
            ctx.lineTo(200, 250);
            ctx.lineTo(100, 250);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // Expanded geometry
            ctx.fillStyle = colors.primary + '40';
            ctx.strokeStyle = colors.primary;
            const centerX = 350;
            const centerY = 200;
            const count = Math.floor(progress * 8) + 3;

            for (let i = 0; i < count; i++) {
                const angle = (i / count) * Math.PI * 2;
                const x = centerX + Math.cos(angle) * 80;
                const y = centerY + Math.sin(angle) * 80;
                ctx.beginPath();
                ctx.arc(x, y, 15 + progress * 10, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
            }
        }

        function animateRasterization(t) {
            drawBackground();
            const colors = Wiki.colors();
            const progress = (Math.sin(t * 0.7) + 1) / 2;

            ctx.font = 'bold 14px JetBrains Mono';
            ctx.fillStyle = colors.text;
            ctx.fillText('Scan-Converting Triangle to Pixels', 50, 40);

            // Draw triangle
            const verts = [[150, 120], [350, 250], [100, 300]];
            ctx.strokeStyle = colors.accent;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(verts[0][0], verts[0][1]);
            ctx.lineTo(verts[1][0], verts[1][1]);
            ctx.lineTo(verts[2][0], verts[2][1]);
            ctx.closePath();
            ctx.stroke();

            // Animate pixel filling
            const pixelSize = 8;
            const startY = Math.min(...verts.map(v => v[1]));
            const endY = Math.max(...verts.map(v => v[1]));
            const maxRows = Math.floor((endY - startY) / pixelSize);
            const visibleRows = Math.floor(progress * maxRows);

            for (let row = 0; row < visibleRows; row++) {
                const y = startY + row * pixelSize;
                const alpha = (row < visibleRows - 2) ? 1 : progress;
                ctx.fillStyle = colors.primary + Math.floor(alpha * 200).toString(16).padStart(2, '0');

                for (let x = 100; x < 400; x += pixelSize) {
                    ctx.fillRect(x, y, pixelSize - 1, pixelSize - 1);
                }
            }
        }

        function animateFragmentShader(t) {
            drawBackground();
            const colors = Wiki.colors();
            const progress = (Math.sin(t * 0.7) + 1) / 2;

            ctx.font = 'bold 14px JetBrains Mono';
            ctx.fillStyle = colors.text;
            ctx.fillText('Fragment Shader: Per-Pixel Processing', 50, 40);

            // Sphere rendered with shading
            const centerX = 250;
            const centerY = 220;
            const radius = 80;

            for (let x = centerX - radius; x < centerX + radius; x += 2) {
                for (let y = centerY - radius; y < centerY + radius; y += 2) {
                    const dx = x - centerX;
                    const dy = y - centerY;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < radius) {
                        const intensity = (1 - dist / radius) * 0.8 + 0.2;
                        const lighting = Math.max(0, (dx * 0.6 + dy * 0.8) / (radius * 1.4));
                        const finalIntensity = intensity * (0.5 + lighting * 0.5);

                        const hue = (progress * 360) % 360;
                        ctx.fillStyle = `hsl(${hue}, 70%, ${finalIntensity * 50}%)`;
                        ctx.fillRect(x, y, 2, 2);
                    }
                }
            }
        }

        function animateFramebuffer(t) {
            drawBackground();
            const colors = Wiki.colors();
            const progress = (Math.sin(t * 0.5) + 1) / 2;

            ctx.font = 'bold 14px JetBrains Mono';
            ctx.fillStyle = colors.text;
            ctx.fillText('Depth Testing & Blending', 50, 40);

            // Back layer
            ctx.fillStyle = colors.accent + '80';
            ctx.fillRect(120, 180, 120, 120);
            ctx.fillText('Back', 140, 305);

            // Front layer with alpha blend animation
            ctx.globalAlpha = 0.3 + progress * 0.7;
            ctx.fillStyle = colors.primary;
            ctx.fillRect(200 + progress * 50, 150, 120, 120);
            ctx.fillText('Front (blended)', 210, 125);
            ctx.globalAlpha = 1.0;

            // Z-buffer indicator
            ctx.font = '11px JetBrains Mono';
            ctx.fillStyle = colors.accent;
            ctx.fillText('z_buffer test: depth < existing', 100, 430);
        }

        function animate(t = 0) {
            animationTime += 0.016;
            stages[currentStage].animate(animationTime);
            requestAnimationFrame(animate);
        }

        setupStages();
        updateUI();
        animate();
    </script>
</body>
</html>
