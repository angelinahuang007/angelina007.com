<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photoshop Compositing Layers</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/lib/wiki-interactive.css" />
    <script src="/lib/wiki-interactive.js"></script>
    <style>
        .compositing-container {
            display: flex; flex-wrap: wrap;
            gap: 20px;
            height: 100%;
        }
        .canvas-area {
            flex: 1;
            background: linear-gradient(135deg, var(--bg-secondary) 0%, var(--bg-tertiary) 100%);
            border-radius: 8px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
        }
        .canvas-wrapper {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
            flex: 1;
            min-height: 250px;
        }
        .canvas-wrapper canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        .layer-info {
            background: var(--border);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 12px;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 11px;
            color: var(--text);
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 12px;
        }
        .info-item {
            text-align: center;
        }
        .info-label {
            color: var(--text-dim);
            font-size: 10px;
            text-transform: uppercase;
            margin-bottom: 4px;
        }
        .info-value {
            font-family: 'JetBrains Mono', monospace;
            color: var(--accent);
            font-weight: bold;
        }
        .control-panel {
            width: 280px;
            background: var(--bg-secondary);
            border-radius: 8px;
            padding: 16px;
            overflow-y: auto;
            color: var(--text);
            font-family: 'Space Grotesk', sans-serif;
            font-size: 13px;
        }
        .control-group {
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border);
        }
        .control-group h4 {
            margin: 0 0 8px 0;
            font-size: 12px;
            text-transform: uppercase;
            color: var(--accent);
            letter-spacing: 0.5px;
        }
        .layer-list {
            background: var(--border);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 4px;
            max-height: 250px;
            overflow-y: auto;
        }
        .layer-item {
            padding: 8px;
            margin-bottom: 4px;
            background: var(--border-strong);
            border-radius: 3px;
            cursor: pointer;
            display: grid;
            grid-template-columns: 20px 1fr 30px;
            gap: 8px;
            align-items: center;
            transition: all 0.2s;
            font-size: 11px;
        }
        .layer-item:hover {
            background: var(--border-strong);
            opacity: 0.7;
        }
        .layer-item.selected {
            background: var(--accent);
            opacity: 0.3;
            border-left: 2px solid var(--accent);
        }
        .layer-icon {
            width: 16px;
            height: 16px;
            border-radius: 2px;
            border: 1px solid var(--border-strong);
        }
        .layer-name {
            color: var(--text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .layer-eye {
            cursor: pointer;
            text-align: right;
            color: var(--text-dim);
            font-size: 10px;
        }
        .slider-row {
            margin-bottom: 8px;
        }
        .slider-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 3px;
            font-size: 11px;
        }
        input[type="range"] {
            width: 100%;
            height: 3px;
            border-radius: 2px;
            background: var(--border-strong);
            outline: none;
            -webkit-appearance: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--accent);
            cursor: pointer;
        }
        input[type="range"]::-moz-range-thumb {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--accent);
            border: none;
            cursor: pointer;
        }
        .blend-mode-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px;
            margin-bottom: 8px;
        }
        .blend-btn {
            padding: 4px;
            background: var(--border);
            border: 1px solid var(--border-strong);
            color: var(--text);
            border-radius: 2px;
            cursor: pointer;
            font-size: 9px;
            transition: all 0.2s;
        }
        .blend-btn:hover {
            background: var(--border-strong);
        }
        .blend-btn.active {
            background: var(--accent);
            color: var(--bg-secondary);
            border-color: var(--accent);
        }
        .info-text {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 12px;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="compositing-container">
        <div class="canvas-area">
            <div class="canvas-wrapper">
                <canvas id="compositCanvas"></canvas>
            </div>

            <div class="layer-info">
                <div class="info-item">
                    <div class="info-label">Selected Layer</div>
                    <div class="info-value" id="selectedName">Layer 1</div>
                </div>
                <div class="info-item">
                    <div class="info-label">Blend Mode</div>
                    <div class="info-value" id="blendMode">Normal</div>
                </div>
                <div class="info-item">
                    <div class="info-label">Opacity</div>
                    <div class="info-value" id="opacityValue">100%</div>
                </div>
            </div>
        </div>

        <div class="control-panel">
            <div class="control-group">
                <h4>Layers</h4>
                <div class="layer-list" id="layerList"></div>
            </div>

            <div class="control-group">
                <h4>Blend Mode</h4>
                <div class="blend-mode-grid" id="blendModes">
                    <button class="blend-btn active" data-mode="normal">Normal</button>
                    <button class="blend-btn" data-mode="multiply">Multiply</button>
                    <button class="blend-btn" data-mode="screen">Screen</button>
                    <button class="blend-btn" data-mode="overlay">Overlay</button>
                </div>
            </div>

            <div class="control-group">
                <h4>Opacity</h4>
                <div class="slider-row">
                    <div class="slider-label"><span>Opacity</span><span id="opacityPercent">100%</span></div>
                    <input type="range" id="opacitySlider" min="0" max="100" value="100">
                </div>
            </div>

            <div class="control-group">
                <h4>Layer Mask</h4>
                <div style="background: rgba(233, 236, 239, 0.05); border: 1px solid rgba(233, 236, 239, 0.1); border-radius: 4px; padding: 8px; font-size: 11px;">
                    <div style="margin-bottom: 6px; color: var(--text-muted);">White = Show, Black = Hide</div>
                    <button style="width: 100%; padding: 6px; background: rgba(22, 160, 133, 0.2); border: 1px solid rgba(22, 160, 133, 0.4); color: #16a085; border-radius: 3px; cursor: pointer; font-size: 10px; margin-bottom: 4px;">+ Add Mask</button>
                    <button style="width: 100%; padding: 6px; background: var(--bg-tertiary); border: 1px solid var(--border-strong); color: var(--text); border-radius: 3px; cursor: pointer; font-size: 10px;">Delete Mask</button>
                </div>
            </div>

            <div class="info-text">
                Click layers to select. Drag to reorder. Toggle eye icon to show/hide. Adjust opacity and blend mode for each layer.
            </div>
        </div>
    </div>

    <script>
        class CompositingDemo {
            constructor() {
                this.canvas = document.getElementById('compositCanvas');
                this.ctx = this.canvas.getContext('2d');

                // Layers with content
                this.layers = [
                    {
                        name: 'Background',
                        visible: true,
                        opacity: 100,
                        blendMode: 'normal',
                        render: (ctx, w, h) => {
                            const grad = ctx.createLinearGradient(0, 0, w, h);
                            grad.addColorStop(0, '#e8f4f8');
                            grad.addColorStop(1, '#b3d9ff');
                            ctx.fillStyle = grad;
                            ctx.fillRect(0, 0, w, h);
                        }
                    },
                    {
                        name: 'Shape 1',
                        visible: true,
                        opacity: 100,
                        blendMode: 'normal',
                        render: (ctx, w, h) => {
                            ctx.fillStyle = '#e74c3c';
                            ctx.fillRect(w * 0.1, h * 0.1, w * 0.35, h * 0.4);
                        }
                    },
                    {
                        name: 'Shape 2',
                        visible: true,
                        opacity: 100,
                        blendMode: 'normal',
                        render: (ctx, w, h) => {
                            ctx.fillStyle = '#3498db';
                            ctx.beginPath();
                            ctx.arc(w * 0.7, h * 0.3, w * 0.15, 0, Math.PI * 2);
                            ctx.fill();
                        }
                    },
                    {
                        name: 'Shape 3',
                        visible: true,
                        opacity: 100,
                        blendMode: 'normal',
                        render: (ctx, w, h) => {
                            ctx.fillStyle = '#f39c12';
                            ctx.beginPath();
                            ctx.moveTo(w * 0.25, h * 0.7);
                            ctx.lineTo(w * 0.4, h * 0.95);
                            ctx.lineTo(w * 0.1, h * 0.95);
                            ctx.closePath();
                            ctx.fill();
                        }
                    }
                ];

                this.selectedLayerIdx = 0;
                this.resizeCanvas();
                window.addEventListener('resize', () => this.resizeCanvas());
                this.setupEvents();
                this.render();
            }

            resizeCanvas() {
                const rect = this.canvas.parentElement.getBoundingClientRect();
                this.canvas.width = rect.width;
                this.canvas.height = rect.height;
                this.render();
            }

            setupEvents() {
                this.updateLayerList();

                document.querySelectorAll('[data-mode]').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        document.querySelectorAll('[data-mode]').forEach(b => b.classList.remove('active'));
                        e.target.classList.add('active');
                        this.layers[this.selectedLayerIdx].blendMode = e.target.dataset.mode;
                        document.getElementById('blendMode').textContent = e.target.dataset.mode.charAt(0).toUpperCase() + e.target.dataset.mode.slice(1);
                        this.render();
                    });
                });

                document.getElementById('opacitySlider').addEventListener('input', (e) => {
                    const val = parseInt(e.target.value);
                    this.layers[this.selectedLayerIdx].opacity = val;
                    document.getElementById('opacityPercent').textContent = val + '%';
                    document.getElementById('opacityValue').textContent = val + '%';
                    this.render();
                });
            }

            updateLayerList() {
                const list = document.getElementById('layerList');
                list.innerHTML = this.layers.map((layer, idx) => `
                    <div class="layer-item ${idx === this.selectedLayerIdx ? 'selected' : ''}" onclick="compositing.selectLayer(${idx})">
                        <div class="layer-icon" style="background: ${this.getLayerColor(idx)};"></div>
                        <div class="layer-name">${layer.name}</div>
                        <div class="layer-eye" onclick="event.stopPropagation(); compositing.toggleLayer(${idx})">
                            ${layer.visible ? '👁' : '○'}
                        </div>
                    </div>
                `).join('');
            }

            getLayerColor(idx) {
                const colors = ['#e8f4f8', '#e74c3c', '#3498db', '#f39c12'];
                return colors[idx] || '#34495e';
            }

            selectLayer(idx) {
                this.selectedLayerIdx = idx;
                const layer = this.layers[idx];
                document.getElementById('selectedName').textContent = layer.name;
                document.getElementById('blendMode').textContent = layer.blendMode.charAt(0).toUpperCase() + layer.blendMode.slice(1);
                document.getElementById('opacityValue').textContent = layer.opacity + '%';
                document.getElementById('opacityPercent').textContent = layer.opacity + '%';
                document.getElementById('opacitySlider').value = layer.opacity;

                document.querySelectorAll('[data-mode]').forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.mode === layer.blendMode);
                });

                this.updateLayerList();
            }

            toggleLayer(idx) {
                this.layers[idx].visible = !this.layers[idx].visible;
                this.updateLayerList();
                this.render();
            }

            applyBlendMode(ctx, mode, opacity) {
                ctx.globalAlpha = opacity / 100;
                switch (mode) {
                    case 'multiply':
                        ctx.globalCompositeOperation = 'multiply';
                        break;
                    case 'screen':
                        ctx.globalCompositeOperation = 'screen';
                        break;
                    case 'overlay':
                        ctx.globalCompositeOperation = 'overlay';
                        break;
                    default:
                        ctx.globalCompositeOperation = 'source-over';
                }
            }

            render() {
                const w = this.canvas.width;
                const h = this.canvas.height;

                // Clear canvas
                this.ctx.fillStyle = '#f0f0f0';
                this.ctx.fillRect(0, 0, w, h);

                // Render layers
                this.layers.forEach((layer, idx) => {
                    if (!layer.visible) return;

                    this.applyBlendMode(this.ctx, layer.blendMode, layer.opacity);
                    layer.render(this.ctx, w, h);
                });

                // Reset composite
                this.ctx.globalCompositeOperation = 'source-over';
                this.ctx.globalAlpha = 1;

                // Draw checkerboard for transparency
                this.ctx.globalAlpha = 0.3;
                const size = 8;
                for (let y = 0; y < h; y += size * 2) {
                    for (let x = 0; x < w; x += size * 2) {
                        this.ctx.fillStyle = '#999';
                        this.ctx.fillRect(x, y, size, size);
                        this.ctx.fillRect(x + size, y + size, size, size);
                    }
                }
                this.ctx.globalAlpha = 1;
            }
        }

        const compositing = new CompositingDemo();
    </script>
</body>
</html>
