name: Build and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

# 同一时间只允许一个部署在跑，避免连续 push 时互相踩
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build:
    name: Build (smoke test)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # lint 只做提示，不阻塞部署（等 P1 阶段代码清理完再改成强制）
      - name: Run linter (advisory)
        run: npm run lint
        continue-on-error: true

      - name: Build Next.js application
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://angelina007.com

  deploy:
    name: Deploy to droplet
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment:
      name: production
      url: https://angelina007.com
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DROPLET_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.DROPLET_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to Digital Ocean
        run: |
          ssh ${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_HOST }} << 'EOF'
            set -e
            cd ~/angelina007.com

            # 用 fetch + reset 而不是 pull：即使远端历史被改写也能可靠对齐
            git fetch origin
            git reset --hard origin/main

            # 构建并启动（--build 会利用缓存，只重建有变化的层）
            docker compose up -d --build --remove-orphans

            docker compose ps
            echo "Deployment completed"
          EOF

      - name: Verify deployment
        run: |
          sleep 10
          curl -fsS -o /dev/null https://angelina007.com/ && echo "OK: site responds with valid TLS"
